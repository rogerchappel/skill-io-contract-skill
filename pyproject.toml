[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-io-contract-skill"
version = "0.1.0"
description = "Local-first IO contract checker for reusable agent skills."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roger Chappel" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
skill-io-contract = "skill_io_contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


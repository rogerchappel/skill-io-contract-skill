[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skill-io-contract-skill"
version = "0.1.0"
description = "Local-first IO contract checker for reusable agent skills."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Roger Chappel" }]
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8"]

[project.scripts]
skill-io-contract = "skill_io_contract.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/skill-io-contract-skill" = ["SKILL.md"]
"share/skill-io-contract-skill/fixtures" = ["fixtures/cases.json"]

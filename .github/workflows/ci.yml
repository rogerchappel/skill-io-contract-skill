name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: npm test
      - run: npm run check
      - run: npm run smoke

  release:
    name: Distribution and documented install
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install -e ".[dev]"
      - name: Verify documented GitHub install
        run: python scripts/verify_documented_install.py
      - name: Validate report output error contract
        run: |
          set +e
          python -m skill_io_contract check --skill SKILL.md --fixtures fixtures/cases.json --report /tmp 2>report-error.txt
          status=$?
          set -e
          test "$status" -eq 2
          grep -F "cannot write --report '/tmp': is a directory" report-error.txt
          ! grep -F "Traceback" report-error.txt
      - run: python -m build
      - name: Verify distribution contents and installed contract
        run: python scripts/verify_distribution.py dist
